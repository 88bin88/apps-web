<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机抽号系统 - 公平公正的随机抽取工具</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <!-- 统一的 Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        accent: '#F59E0B',
                        dark: '#1F2937',
                        light: '#F3F4F6',
                        danger: '#EF4444',
                        success: '#10B981',
                        warning: '#F59E0B'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                        'bounce-slow': 'bounce 2s infinite',
                        'pulse-fast': 'pulse 1s infinite',
                        'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                        'number-change': 'numberChange 0.1s ease-in-out',
                    },
                    keyframes: {
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        },
                        numberChange: {
                            '0%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.1)' },
                            '100%': { transform: 'scale(1)' }
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-shadow {
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            }
            .text-shadow-lg {
                text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5);
            }
            .glass {
                background: rgba(255, 255, 255, 0.25);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.18);
            }
            .glass-dark {
                background: rgba(31, 41, 55, 0.85);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.08);
            }
            .number-display {
                font-variant-numeric: tabular-nums;
            }
            .confetti {
                position: absolute;
                width: 10px;
                height: 10px;
                opacity: 0;
                animation: confetti-fall 3s ease-in-out forwards;
            }
            @keyframes confetti-fall {
                0% {
                    transform: translateY(-10vh) rotate(0deg);
                    opacity: 1;
                }
                100% {
                    transform: translateY(100vh) rotate(720deg);
                    opacity: 0;
                }
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-900 to-purple-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- 头部标题 -->
        <header class="text-center mb-8">
            <h1 class="text-5xl font-bold text-white mb-2 text-shadow">随机抽号系统</h1>
            <p class="text-blue-200 text-xl">公平公正的随机抽取工具</p>
        </header>

        <!-- 主要内容区 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 左侧控制面板 -->
            <div class="lg:col-span-1">
                <div class="glass-dark rounded-xl p-6 shadow-lg mb-8">
                    <h2 class="text-xl font-semibold mb-6 flex items-center">
                        <i class="fa fa-sliders mr-2 text-primary"></i>抽取设置
                    </h2>
                    
                    <!-- 范围设置 -->
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-blue-200 mb-2">抽取范围</label>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label for="minRange" class="block text-xs text-blue-300 mb-1">最小值</label>
                                <input type="number" id="minRange" min="1" max="9999" value="1" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-primary focus:border-transparent">
                            </div>
                            <div>
                                <label for="maxRange" class="block text-xs text-blue-300 mb-1">最大值</label>
                                <input type="number" id="maxRange" min="2" max="10000" value="100" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-primary focus:border-transparent">
                            </div>
                        </div>
                    </div>
                    
                    <!-- 抽取数量 -->
                    <div class="mb-6">
                        <label for="drawCount" class="block text-sm font-medium text-blue-200 mb-2">抽取数量: <span id="drawCountValue">1</span></label>
                        <input type="range" id="drawCount" min="1" max="20" value="1" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    
                    <!-- 是否允许重复 -->
                    <div class="mb-6">
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="allowRepeat" class="sr-only peer">
                            <div class="relative w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                            <span class="ml-3 text-sm font-medium text-blue-200">允许重复抽取</span>
                        </label>
                    </div>
                    
                    <!-- 排除号码 -->
                    <div class="mb-6">
                        <label for="excludeNumbers" class="block text-sm font-medium text-blue-200 mb-2">排除号码 (用逗号分隔)</label>
                        <input type="text" id="excludeNumbers" placeholder="例如: 1,3,5,7" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-primary focus:border-transparent">
                        <p class="text-xs text-blue-300 mt-1">已排除: <span id="excludedCount">0</span> 个号码</p>
                    </div>
                    
                    <!-- 操作按钮 -->
                    <div class="flex space-x-4">
                        <button id="drawBtn" class="flex-1 bg-primary hover:bg-blue-600 text-white py-3 px-6 rounded-lg transition-colors flex items-center justify-center text-lg font-semibold">
                            <i class="fa fa-random mr-2"></i>开始抽取
                        </button>
                        <button id="resetBtn" class="bg-gray-700 hover:bg-gray-600 text-white py-3 px-4 rounded-lg transition-colors flex items-center justify-center">
                            <i class="fa fa-refresh"></i>
                        </button>
                    </div>
                </div>
                
                <!-- 历史记录 -->
                <div class="glass-dark rounded-xl p-6 shadow-lg">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-semibold flex items-center">
                            <i class="fa fa-history mr-2 text-primary"></i>历史记录
                        </h2>
                        <button id="clearHistoryBtn" class="text-sm text-blue-300 hover:text-blue-200 flex items-center">
                            <i class="fa fa-trash-o mr-1"></i>清空
                        </button>
                    </div>
                    <div id="historyContainer" class="max-h-64 overflow-y-auto pr-2 space-y-2">
                        <p class="text-gray-400 text-center italic py-4">暂无抽取记录</p>
                    </div>
                </div>
            </div>
            
            <!-- 右侧显示区 -->
            <div class="lg:col-span-2">
                <!-- 结果显示 -->
                <div class="glass-dark rounded-xl p-6 shadow-lg mb-8">
                    <h2 class="text-xl font-semibold mb-6 flex items-center">
                        <i class="fa fa-trophy mr-2 text-accent"></i>抽取结果
                    </h2>
                    <div id="resultContainer" class="relative min-h-64 flex items-center justify-center">
                        <div id="resultDisplay" class="text-center">
                            <div id="animationContainer" class="hidden">
                                <div class="inline-block animate-spin-slow text-6xl mb-4">
                                    <i class="fa fa-refresh"></i>
                                </div>
                                <p class="text-blue-200">正在随机抽取中...</p>
                            </div>
                            <div id="resultNumbers" class="hidden">
                                <div class="flex flex-wrap justify-center gap-4 mb-6">
                                    <!-- 结果号码将在这里动态生成 -->
                                </div>
                                <button id="saveResultBtn" class="bg-secondary hover:bg-green-600 text-white py-2 px-6 rounded-lg transition-colors flex items-center justify-center mx-auto">
                                    <i class="fa fa-save mr-2"></i>保存结果
                                </button>
                            </div>
                            <div id="initialState" class="text-center py-12">
                                <div class="text-6xl mb-4 text-blue-300 opacity-70">
                                    <i class="fa fa-gift"></i>
                                </div>
                                <h3 class="text-2xl font-semibold mb-2">准备就绪</h3>
                                <p class="text-blue-200">点击"开始抽取"按钮开始随机抽号</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 统计图表 -->
                <div class="glass-dark rounded-xl p-6 shadow-lg">
                    <h2 class="text-xl font-semibold mb-6 flex items-center">
                        <i class="fa fa-bar-chart mr-2 text-primary"></i>抽取统计
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <canvas id="frequencyChart" height="200"></canvas>
                        </div>
                        <div>
                            <canvas id="recentChart" height="200"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 底部信息 -->
        <footer class="mt-12 text-center text-blue-300 text-sm">
            <p>© 2025 随机抽号系统 - 公平公正的随机抽取工具</p>
            <p class="mt-2">使用密码学安全的随机数生成器，确保抽取结果的公平性</p>
        </footer>
    </div>
    
    <!-- 保存结果模态框 -->
    <div id="saveModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-gray-800 rounded-xl p-6 max-w-md w-full mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-semibold">保存抽取结果</h3>
                <button id="closeModalBtn" class="text-gray-400 hover:text-white">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div class="mb-4">
                <label for="resultName" class="block text-sm font-medium text-blue-200 mb-2">结果名称</label>
                <input type="text" id="resultName" placeholder="例如: 第一轮抽奖" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-blue-200 mb-2">抽取结果</label>
                <div id="saveResultDisplay" class="bg-gray-700 rounded-lg p-3 min-h-12">
                    <!-- 结果将在这里显示 -->
                </div>
            </div>
            <div class="flex space-x-4">
                <button id="confirmSaveBtn" class="flex-1 bg-primary hover:bg-blue-600 text-white py-2 px-6 rounded-lg transition-colors">
                    确认保存
                </button>
                <button id="copyResultBtn" class="bg-gray-700 hover:bg-gray-600 text-white py-2 px-6 rounded-lg transition-colors flex items-center">
                    <i class="fa fa-copy mr-2"></i>复制
                </button>
            </div>
        </div>
    </div>
    
    <!-- 已保存结果模态框 -->
    <div id="savedResultsModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-gray-800 rounded-xl p-6 max-w-lg w-full mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-semibold">已保存的结果</h3>
                <button id="closeSavedModalBtn" class="text-gray-400 hover:text-white">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div id="savedResultsList" class="max-h-80 overflow-y-auto pr-2 space-y-3 mb-4">
                <!-- 已保存结果将在这里显示 -->
            </div>
            <div class="flex justify-end">
                <button id="exportResultsBtn" class="bg-secondary hover:bg-green-600 text-white py-2 px-6 rounded-lg transition-colors flex items-center">
                    <i class="fa fa-download mr-2"></i>导出全部
                </button>
            </div>
        </div>
    </div>

    <script>
        // DOM 元素
        const minRange = document.getElementById('minRange');
        const maxRange = document.getElementById('maxRange');
        const drawCount = document.getElementById('drawCount');
        const drawCountValue = document.getElementById('drawCountValue');
        const allowRepeat = document.getElementById('allowRepeat');
        const excludeNumbers = document.getElementById('excludeNumbers');
        const excludedCount = document.getElementById('excludedCount');
        const drawBtn = document.getElementById('drawBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resultContainer = document.getElementById('resultContainer');
        const animationContainer = document.getElementById('animationContainer');
        const resultNumbers = document.getElementById('resultNumbers');
        const initialState = document.getElementById('initialState');
        const saveResultBtn = document.getElementById('saveResultBtn');
        const historyContainer = document.getElementById('historyContainer');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const saveModal = document.getElementById('saveModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const resultName = document.getElementById('resultName');
        const saveResultDisplay = document.getElementById('saveResultDisplay');
        const confirmSaveBtn = document.getElementById('confirmSaveBtn');
        const copyResultBtn = document.getElementById('copyResultBtn');
        const savedResultsModal = document.getElementById('savedResultsModal');
        const closeSavedModalBtn = document.getElementById('closeSavedModalBtn');
        const savedResultsList = document.getElementById('savedResultsList');
        const exportResultsBtn = document.getElementById('exportResultsBtn');
        
        // 应用状态
        let appState = {
            currentDraw: [],
            history: [],
            savedResults: [],
            availableNumbers: [],
            isDrawing: false,
            animationInterval: null,
            charts: {
                frequency: null,
                recent: null
            }
        };
        
        // 初始化
        function init() {
            // 从本地存储加载数据
            loadData();
            
            // 设置事件监听器
            setupEventListeners();
            
            // 初始化图表
            initCharts();
            
            // 更新UI
            updateExcludedCount();
            updateDrawCountValue();
            
            // 添加"查看已保存结果"按钮到页面
            addSavedResultsButton();
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            // 范围输入变化
            minRange.addEventListener('input', updateAvailableNumbers);
            maxRange.addEventListener('input', updateAvailableNumbers);
            
            // 抽取数量变化
            drawCount.addEventListener('input', () => {
                updateDrawCountValue();
                updateAvailableNumbers();
            });
            
            // 排除号码变化
            excludeNumbers.addEventListener('input', () => {
                updateExcludedCount();
                updateAvailableNumbers();
            });
            
            // 抽取按钮点击
            drawBtn.addEventListener('click', startDraw);
            
            // 重置按钮点击
            resetBtn.addEventListener('click', resetApp);
            
            // 保存结果按钮点击
            saveResultBtn.addEventListener('click', openSaveModal);
            
            // 关闭保存模态框
            closeModalBtn.addEventListener('click', closeSaveModal);
            
            // 确认保存按钮点击
            confirmSaveBtn.addEventListener('click', saveResult);
            
            // 复制结果按钮点击
            copyResultBtn.addEventListener('click', copyResult);
            
            // 清空历史记录按钮点击
            clearHistoryBtn.addEventListener('click', clearHistory);
            
            // 关闭已保存结果模态框
            closeSavedModalBtn.addEventListener('click', closeSavedResultsModal);
            
            // 导出结果按钮点击
            exportResultsBtn.addEventListener('click', exportResults);
            
            // 点击模态框背景关闭模态框
            saveModal.addEventListener('click', (e) => {
                if (e.target === saveModal) closeSaveModal();
            });
            
            savedResultsModal.addEventListener('click', (e) => {
                if (e.target === savedResultsModal) closeSavedResultsModal();
            });
            
            // 键盘快捷键
            document.addEventListener('keydown', (e) => {
                // Enter 开始抽取
                if (e.key === 'Enter' && !appState.isDrawing) {
                    startDraw();
                }
                
                // ESC 关闭模态框
                if (e.key === 'Escape') {
                    closeSaveModal();
                    closeSavedResultsModal();
                }
            });
        }
        
        // 更新可用号码列表
        function updateAvailableNumbers() {
            const min = parseInt(minRange.value) || 1;
            const max = parseInt(maxRange.value) || 100;
            
            // 确保最小值小于最大值
            if (min >= max) {
                maxRange.value = min + 1;
            }
            
            // 生成可用号码列表
            let numbers = [];
            for (let i = min; i <= max; i++) {
                numbers.push(i);
            }
            
            // 移除排除的号码
            const excluded = getExcludedNumbers();
            if (excluded.length > 0) {
                numbers = numbers.filter(num => !excluded.includes(num));
            }
            
            // 如果不允许重复，并且已经抽取过号码，则从可用号码中移除已抽取的号码
            if (!allowRepeat.checked && appState.currentDraw.length > 0) {
                numbers = numbers.filter(num => !appState.currentDraw.includes(num));
            }
            
            appState.availableNumbers = numbers;
        }
        
        // 获取排除的号码列表
        function getExcludedNumbers() {
            if (!excludeNumbers.value.trim()) return [];
            
            return excludeNumbers.value
                .split(',')
                .map(num => parseInt(num.trim()))
                .filter(num => !isNaN(num));
        }
        
        // 更新排除号码计数
        function updateExcludedCount() {
            const count = getExcludedNumbers().length;
            excludedCount.textContent = count;
        }
        
        // 更新抽取数量显示
        function updateDrawCountValue() {
            drawCountValue.textContent = drawCount.value;
        }
        
        // 开始抽取
        function startDraw() {
            // 防止重复点击
            if (appState.isDrawing) return;
            
            // 更新可用号码
            updateAvailableNumbers();
            
            // 验证输入
            if (appState.availableNumbers.length === 0) {
                showToast('没有可用的号码进行抽取', 'error');
                return;
            }
            
            const count = parseInt(drawCount.value);
            if (count > appState.availableNumbers.length && !allowRepeat.checked) {
                showToast(`可用号码不足，最多只能抽取 ${appState.availableNumbers.length} 个号码`, 'error');
                return;
            }
            
            // 设置状态
            appState.isDrawing = true;
            drawBtn.disabled = true;
            drawBtn.classList.add('opacity-50', 'cursor-not-allowed');
            
            // 显示动画
            initialState.classList.add('hidden');
            resultNumbers.classList.add('hidden');
            animationContainer.classList.remove('hidden');
            
            // 清除之前的结果
            appState.currentDraw = [];
            
            // 开始动画
            let animationCount = 0;
            const maxAnimationCount = 50; // 动画帧数
            
            appState.animationInterval = setInterval(() => {
                animationCount++;
                
                // 随机显示一些号码
                const tempNumbers = [];
                for (let i = 0; i < count; i++) {
                    const randomIndex = Math.floor(Math.random() * appState.availableNumbers.length);
                    tempNumbers.push(appState.availableNumbers[randomIndex]);
                }
                
                // 更新临时显示
                displayTempNumbers(tempNumbers);
                
                // 动画结束，显示最终结果
                if (animationCount >= maxAnimationCount) {
                    clearInterval(appState.animationInterval);
                    finishDraw(count);
                }
            }, 50);
        }
        
        // 显示临时号码（动画用）
        function displayTempNumbers(numbers) {
            // 创建临时显示元素
            let tempDisplay = document.getElementById('tempNumberDisplay');
            if (!tempDisplay) {
                tempDisplay = document.createElement('div');
                tempDisplay.id = 'tempNumberDisplay';
                tempDisplay.className = 'flex flex-wrap justify-center gap-4';
                resultContainer.appendChild(tempDisplay);
            }
            
            // 清空并添加新号码
            tempDisplay.innerHTML = '';
            numbers.forEach(num => {
                const numElement = document.createElement('div');
                numElement.className = 'bg-blue-600 text-white text-4xl font-bold rounded-lg w-16 h-16 flex items-center justify-center shadow-lg animate-number-change';
                numElement.textContent = num;
                tempDisplay.appendChild(numElement);
            });
        }
        
        // 完成抽取
        function finishDraw(count) {
            // 生成最终结果
            const results = [];
            const availableNumbers = [...appState.availableNumbers];
            
            for (let i = 0; i < count; i++) {
                // 如果没有可用号码了，就停止抽取
                if (availableNumbers.length === 0) break;
                
                // 随机选择一个号码
                const randomIndex = Math.floor(Math.random() * availableNumbers.length);
                const selectedNumber = availableNumbers[randomIndex];
                
                // 添加到结果中
                results.push(selectedNumber);
                
                // 如果不允许重复，从可用号码中移除已选择的号码
                if (!allowRepeat.checked) {
                    availableNumbers.splice(randomIndex, 1);
                }
            }
            
            // 更新状态
            appState.currentDraw = results;
            appState.isDrawing = false;
            drawBtn.disabled = false;
            drawBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            
            // 隐藏动画，显示结果
            animationContainer.classList.add('hidden');
            document.getElementById('tempNumberDisplay')?.remove();
            resultNumbers.classList.remove('hidden');
            
            // 显示结果
            displayResults(results);
            
            // 添加到历史记录
            addToHistory(results);
            
            // 更新图表
            updateCharts(results);
            
            // 创建庆祝效果
            createConfetti();
            
            // 保存状态
            saveData();
        }
        
        // 显示抽取结果
        function displayResults(numbers) {
            const container = resultNumbers.querySelector('.flex');
            container.innerHTML = '';
            
            numbers.forEach((num, index) => {
                const numElement = document.createElement('div');
                numElement.className = 'bg-gradient-to-br from-blue-500 to-purple-600 text-white text-4xl font-bold rounded-lg w-20 h-20 flex items-center justify-center shadow-lg transform transition-all duration-300 hover:scale-110 hover:shadow-xl';
                numElement.textContent = num;
                numElement.style.animationDelay = `${index * 0.1}s`;
                numElement.classList.add('animate-bounce-slow');
                container.appendChild(numElement);
            });
        }
        
        // 添加到历史记录
        function addToHistory(numbers) {
            const timestamp = new Date();
            const historyItem = {
                id: Date.now(),
                numbers,
                timestamp,
                range: {
                    min: parseInt(minRange.value),
                    max: parseInt(maxRange.value)
                }
            };
            
            appState.history.unshift(historyItem);
            
            // 限制历史记录数量
            if (appState.history.length > 50) {
                appState.history = appState.history.slice(0, 50);
            }
            
            updateHistoryDisplay();
        }
        
        // 更新历史记录显示
        function updateHistoryDisplay() {
            historyContainer.innerHTML = '';
            
            if (appState.history.length === 0) {
                historyContainer.innerHTML = '<p class="text-gray-400 text-center italic py-4">暂无抽取记录</p>';
                return;
            }
            
            appState.history.forEach(item => {
                const historyElement = document.createElement('div');
                historyElement.className = 'bg-gray-700 rounded-lg p-3 text-sm';
                
                const dateStr = new Date(item.timestamp).toLocaleString('zh-CN', {
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                const numbersStr = item.numbers.join(', ');
                
                historyElement.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-blue-300">${dateStr}</span>
                        <span class="text-xs text-gray-400">${item.range.min}-${item.range.max}</span>
                    </div>
                    <div class="font-mono">${numbersStr}</div>
                `;
                
                historyContainer.appendChild(historyElement);
            });
        }
        
        // 清空历史记录
        function clearHistory() {
            if (appState.history.length === 0) return;
            
            if (confirm('确定要清空所有历史记录吗？')) {
                appState.history = [];
                updateHistoryDisplay();
                saveData();
                showToast('历史记录已清空', 'success');
            }
        }
        
        // 重置应用
        function resetApp() {
            // 重置输入
            minRange.value = 1;
            maxRange.value = 100;
            drawCount.value = 1;
            allowRepeat.checked = false;
            excludeNumbers.value = '';
            
            // 更新UI
            updateExcludedCount();
            updateDrawCountValue();
            updateAvailableNumbers();
            
            // 重置状态
            appState.currentDraw = [];
            
            // 显示初始状态
            initialState.classList.remove('hidden');
            resultNumbers.classList.add('hidden');
            animationContainer.classList.add('hidden');
            document.getElementById('tempNumberDisplay')?.remove();
            
            showToast('应用已重置', 'success');
        }
        
        // 打开保存模态框
        function openSaveModal() {
            if (appState.currentDraw.length === 0) return;
            
            // 设置默认名称
            const now = new Date();
            const dateStr = now.toLocaleDateString('zh-CN');
            const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            resultName.value = `抽取结果 ${dateStr} ${timeStr}`;
            
            // 显示结果
            saveResultDisplay.textContent = appState.currentDraw.join(', ');
            
            // 显示模态框
            saveModal.classList.remove('hidden');
            resultName.focus();
        }
        
        // 关闭保存模态框
        function closeSaveModal() {
            saveModal.classList.add('hidden');
        }
        
        // 保存结果
        function saveResult() {
            const name = resultName.value.trim() || `抽取结果 ${new Date().toLocaleString('zh-CN')}`;
            
            const savedResult = {
                id: Date.now(),
                name,
                numbers: [...appState.currentDraw],
                timestamp: new Date(),
                range: {
                    min: parseInt(minRange.value),
                    max: parseInt(maxRange.value)
                }
            };
            
            appState.savedResults.push(savedResult);
            saveData();
            
            closeSaveModal();
            showToast('结果已保存', 'success');
        }
        
        // 复制结果
        function copyResult() {
            const text = appState.currentDraw.join(', ');
            
            navigator.clipboard.writeText(text).then(() => {
                showToast('结果已复制到剪贴板', 'success');
            }).catch(() => {
                showToast('复制失败，请手动复制', 'error');
            });
        }
        
        // 添加"查看已保存结果"按钮
        function addSavedResultsButton() {
            const header = document.querySelector('header');
            const button = document.createElement('button');
            button.id = 'viewSavedBtn';
            button.className = 'mt-4 bg-gray-800 hover:bg-gray-700 text-white py-2 px-6 rounded-lg transition-colors inline-flex items-center';
            button.innerHTML = '<i class="fa fa-folder-open mr-2"></i>查看已保存结果';
            button.addEventListener('click', openSavedResultsModal);
            
            header.appendChild(button);
        }
        
        // 打开已保存结果模态框
        function openSavedResultsModal() {
            updateSavedResultsList();
            savedResultsModal.classList.remove('hidden');
        }
        
        // 关闭已保存结果模态框
        function closeSavedResultsModal() {
            savedResultsModal.classList.add('hidden');
        }
        
        // 更新已保存结果列表
        function updateSavedResultsList() {
            savedResultsList.innerHTML = '';
            
            if (appState.savedResults.length === 0) {
                savedResultsList.innerHTML = '<p class="text-gray-400 text-center italic py-4">暂无保存的结果</p>';
                return;
            }
            
            appState.savedResults.forEach(result => {
                const resultElement = document.createElement('div');
                resultElement.className = 'bg-gray-700 rounded-lg p-4';
                
                const dateStr = new Date(result.timestamp).toLocaleString('zh-CN');
                const numbersStr = result.numbers.join(', ');
                
                resultElement.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <h4 class="font-semibold text-white">${result.name}</h4>
                        <div>
                            <button class="text-blue-300 hover:text-blue-200 mr-3 copy-saved-btn" data-id="${result.id}">
                                <i class="fa fa-copy"></i>
                            </button>
                            <button class="text-red-400 hover:text-red-300 delete-saved-btn" data-id="${result.id}">
                                <i class="fa fa-trash-o"></i>
                            </button>
                        </div>
                    </div>
                    <div class="text-sm text-gray-300 mb-1">${dateStr}</div>
                    <div class="font-mono text-white">${numbersStr}</div>
                `;
                
                savedResultsList.appendChild(resultElement);
            });
            
            // 添加复制和删除按钮的事件监听器
            document.querySelectorAll('.copy-saved-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.currentTarget.getAttribute('data-id'));
                    const result = appState.savedResults.find(r => r.id === id);
                    if (result) {
                        navigator.clipboard.writeText(result.numbers.join(', ')).then(() => {
                            showToast('结果已复制到剪贴板', 'success');
                        });
                    }
                });
            });
            
            document.querySelectorAll('.delete-saved-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.currentTarget.getAttribute('data-id'));
                    if (confirm('确定要删除这个保存的结果吗？')) {
                        appState.savedResults = appState.savedResults.filter(r => r.id !== id);
                        saveData();
                        updateSavedResultsList();
                        showToast('结果已删除', 'success');
                    }
                });
            });
        }
        
        // 导出结果
        function exportResults() {
            if (appState.savedResults.length === 0) {
                showToast('没有可导出的结果', 'error');
                return;
            }
            
            // 创建CSV内容
            let csvContent = "名称,日期,范围,结果\n";
            
            appState.savedResults.forEach(result => {
                const dateStr = new Date(result.timestamp).toLocaleString('zh-CN');
                const rangeStr = `${result.range.min}-${result.range.max}`;
                const numbersStr = result.numbers.join(';');
                
                // 转义CSV特殊字符
                const name = `"${result.name.replace(/"/g, '""')}"`;
                
                csvContent += `${name},${dateStr},${rangeStr},${numbersStr}\n`;
            });
            
            // 创建下载链接
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `随机抽号结果_${new Date().toISOString().slice(0, 10)}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast('结果已导出为CSV文件', 'success');
        }
        
        // 初始化图表
        function initCharts() {
            // 频率图表
            const frequencyCtx = document.getElementById('frequencyChart').getContext('2d');
            appState.charts.frequency = new Chart(frequencyCtx, {
                type: 'bar',
                data: {

                    datasets: [{
                        label: '出现频率',

                        },

            const recentCtx = document.getElementById('recentChart').getContext('2d');
            appState.charts.recent = new Chart(recentCtx, {

                    }]
                },
                options: {

                            color: '#e2e8f0',
                            font: {
                                size: 14
                            }
                        }
                    },
                    scales: {
                        y: {
                            ticks: {
                                color: '#94a3b8'
                            },
                            grid: {
                                color: 'rgba(148, 163, 184, 0.1)'
                            }
                        },
                        x: {
                            ticks: {
                                color: '#94a3b8'
                            },
                            grid: {
                                color: 'rgba(148, 163, 184, 0.1)'
                            }
                        }
                    }
                }
            });

        // 更新图表
        function updateCharts(newNumbers) {
            // 更新频率图表
            updateFrequencyChart(newNumbers);
            
            // 更新最近抽取图表
            updateRecentChart(newNumbers);
        }
        
        // 更新频率图表
        function updateFrequencyChart(newNumbers) {
            // 收集所有历史抽取的号码
            const allNumbers = [];
            appState.history.forEach(item => {
                allNumbers.push(...item.numbers);
            });
            
            // 计算频率
            const frequency = {};
            allNumbers.forEach(num => {
                frequency[num] = (frequency[num] || 0) + 1;
            });
            
            // 获取出现频率最高的前10个号码
            const sortedNumbers = Object.keys(frequency)
                .map(Number)
                .sort((a, b) => frequency[b] - frequency[a])
                .slice(0, 10);
            
            // 更新图表数据
            appState.charts.frequency.data.labels = sortedNumbers.map(String);
            appState.charts.frequency.data.datasets[0].data = sortedNumbers.map(num => frequency[num]);
            appState.charts.frequency.update();
        }
        
        // 更新最近抽取图表
        function updateRecentChart(newNumbers) {
            // 获取最近20次抽取记录
            const recentHistory = appState.history.slice(0, 20);
            
            // 准备数据
            const labels = [];
            const data = [];
            
            recentHistory.forEach((item, index) => {
                const date = new Date(item.timestamp);
                const timeStr = `${date.getHours()}:${date.getMinutes().toString().padStart(2, '0')}`;
                labels.push(timeStr);
                
                // 如果有多个号码，取平均值
                const avg = item.numbers.reduce((sum, num) => sum + num, 0) / item.numbers.length;
                data.push(avg);
            });
            
            // 更新图表数据
            appState.charts.recent.data.labels = labels.reverse();
            appState.charts.recent.data.datasets[0].data = data.reverse();
            appState.charts.recent.update();
        }
        
        // 创建庆祝效果
        function createConfetti() {
            const colors = ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899'];
            const container = document.body;
            
            // 创建100个纸屑
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = `${Math.random() * 100}%`;
                confetti.style.width = `${Math.random() * 10 + 5}px`;
                confetti.style.height = `${Math.random() * 10 + 5}px`;
                confetti.style.animationDelay = `${Math.random() * 3}s`;
                confetti.style.animationDuration = `${Math.random() * 3 + 2}s`;
                
                container.appendChild(confetti);
                
                // 动画结束后移除元素
                confetti.addEventListener('animationend', () => {
                    confetti.remove();
                });
            }
        }
        
        // 显示提示消息
        function showToast(message, type = 'info') {
            // 创建提示元素
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 right-4 z-50 px-4 py-2 rounded-lg shadow-lg transform transition-all duration-300 translate-x-full opacity-0';
            
            // 根据类型设置样式
            switch (type) {
                case 'success':
                    toast.classList.add('bg-green-500', 'text-white');
                    break;
                case 'error':
                    toast.classList.add('bg-red-500', 'text-white');
                    break;
                default:
                    toast.classList.add('bg-blue-500', 'text-white');
            }
            
            // 设置内容
            toast.textContent = message;
            
            // 添加到页面
            document.body.appendChild(toast);
            
            // 显示提示
            setTimeout(() => {
                toast.classList.remove('translate-x-full', 'opacity-0');
            }, 10);
            
            // 自动隐藏
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }
        
        // 保存数据到本地存储
        function saveData() {
            const dataToSave = {
                history: appState.history,
                savedResults: appState.savedResults
            };
            
            localStorage.setItem('randomDrawData', JSON.stringify(dataToSave));
        }
        
        // 从本地存储加载数据
        function loadData() {
            try {
                const savedData = localStorage.getItem('randomDrawData');
                if (savedData) {
                    const parsedData = JSON.parse(savedData);
                    
                    // 恢复历史记录
                    if (parsedData.history) {
                        appState.history = parsedData.history.map(item => ({
                            ...item,
                            timestamp: new Date(item.timestamp)
                        }));
                    }
                    
                    // 恢复保存的结果
                    if (parsedData.savedResults) {
                        appState.savedResults = parsedData.savedResults.map(item => ({
                            ...item,
                            timestamp: new Date(item.timestamp)
                        }));
                    }
                    
                    // 更新UI
                    updateHistoryDisplay();
                }
            } catch (error) {
                console.error('加载数据失败:', error);
            }
        }
        
        // 初始化应用
        init();
    </script>
